name: CI

# Fast checks on every push and PR: everything compiles, and the offline
# extractor validation harness (mock CT.gov studies asserting alias mapping,
# row-level routing, and quarantine behavior) passes.

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt   # includes requirements.txt

      - name: Compile all Python sources
        run: python -m compileall -q src scripts sponsors tests

      - name: Run extractor validation harness
        run: python scripts/validate_fixes.py

      - name: Run the Python test suite (sponsor rules, index, adapter, fixture regression, audit loop, snapshot pruning)
        run: python -m pytest tests -q

      - name: Set up Node (pinned so the ESM tests do not depend on the runner default)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run browser filter module tests
        run: node --test tests/sponsors/*.test.mjs
