name: Extract Demographics Data

# Weekly demographics extraction. Runs the pipeline in this repo, then
# publishes the dashboard artifacts into michaeldgreenphd/clinical-trial-populations
# (the GitHub Pages site) via the PIPELINE_DEPLOY_TOKEN fine-grained PAT.

on:
  schedule:
    - cron: '0 6 * * 0'  # Weekly on Sunday at 6 AM UTC
  workflow_dispatch:  # Manual trigger

jobs:
  extract:
    runs-on: ubuntu-latest
    env:
      GDRIVE_ENABLED: ${{ secrets.GDRIVE_CLIENT_ID != '' }}
    permissions:
      contents: write  # for the weekly GitHub Release backup in THIS repo

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set current date
        run: echo "CURRENT_DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run extraction
        id: extract
        # pipefail so a tee'd log can never mask an extraction failure
        run: |
          set -o pipefail
          # --snapshot-date stamps every sex_gender row and raw-measure record
          # with the same date the snapshot folder and release tag use.
          python -m src.extract_all --output data/demographics.json --results-after 2009-01-01 --snapshot-date "$CURRENT_DATE" 2>&1 | tee extraction_log.txt

      - name: Build the sex/gender table (full record) and write the lean rows back
        # The full per-trial row is rebuilt from the retained raw measures into
        # sex_gender_parsed.csv.gz (the record every consumer reads); the study
        # records keep only the lean subset (--write-back), so the parts the
        # site loads at startup stay small. --strict: a failed structural check (the
        # five-state, participant-unit or version invariants) fails the run
        # here, before anything is published, so an invalid table can never
        # become production data; the site keeps last week's files.
        run: |
          python3 scripts/build_sex_gender_table.py \
            --from-raw data/sex_gender_raw_measures.jsonl.gz \
            --snapshot-date "$CURRENT_DATE" \
            --write-back data/demographics.json \
            --strict

      - name: Compress CT.gov Data for Drive
        id: compress_full
        # Runs whenever the extraction succeeded, even when the sex/gender
        # table build above failed: that failure still stops the site publish
        # (every later step without its own if: is skipped), but the week's
        # full records must reach their data-* release below, since a re-run
        # pulls the registry again and cannot recover this week. The build's
        # write-back replaces data/demographics.json whole or not at all, so
        # the file here is the extraction's or the rebuilt one, never partial.
        # -k keeps the original so the split step can still read it.
        if: ${{ !cancelled() && steps.extract.outcome == 'success' }}
        run: gzip -k data/demographics.json

      - name: Upload CT.gov Data to Google Drive via OAuth
        # Backups are best-effort: skipped when Drive secrets aren't
        # configured, and a failure warns loudly but never blocks the
        # weekly publish (Drive failures went unnoticed for months when
        # they could take the whole run down with them). Like the release,
        # it runs whenever the full file was compressed, even after a failed
        # sex/gender table build.
        if: ${{ !cancelled() && steps.compress_full.outcome == 'success' && env.GDRIVE_ENABLED == 'true' }}
        env:
          CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          CHILD_FOLDER: CT_gov_API_Data
          FILE_PATH: ${{ github.workspace }}/data/demographics.json.gz
          FILE_NAME: ${{ env.CURRENT_DATE }}_CTgov_demographics.json.gz
        run: python scripts/gdrive_upload.py || echo "::warning::Google Drive upload failed — see this step's log. Publishing is unaffected."

      - name: Upload retained sex/gender raw measures to Google Drive
        # The SELECTED sex/gender baseline measures per trial, verbatim, so any
        # later parser rule change can re-parse this snapshot without a
        # registry pull (scripts/build_sex_gender_table.py --from-raw). Runs
        # whenever the extraction succeeded, a failed table build included.
        if: ${{ !cancelled() && steps.extract.outcome == 'success' && env.GDRIVE_ENABLED == 'true' }}
        env:
          CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          CHILD_FOLDER: CT_gov_API_Data
          FILE_PATH: ${{ github.workspace }}/data/sex_gender_raw_measures.jsonl.gz
          FILE_NAME: ${{ env.CURRENT_DATE }}_sex_gender_raw_measures.jsonl.gz
        run: python scripts/gdrive_upload.py || echo "::warning::Google Drive upload of the raw sex/gender measures failed — see this step's log. Publishing is unaffected."

      - name: Generate dashboard artifacts
        # The site's dataset files (the parts, and the split layout's files)
        # are cut after the site checkout, from the site's own contract: see
        # "Cut the week's records into the site's dataset files".
        run: |
          # The mobile dashboard summary. Both generators read the full
          # records, never the parts (src/full_records.py)
          python3 scripts/generate_mobile_data.py --demographics data/demographics.json
          # Gated industry sponsor view dataset (/#industry)
          python3 scripts/generate_industry_sponsors.py --demographics data/demographics.json
          # Backend-served methods text for the sex/gender table (built above)
          python3 scripts/write_sex_gender_methods.py

          echo "dashboard-summary.json: $(du -h data/dashboard-summary.json | cut -f1)"

      - name: Keep the week's full records on a permanent GitHub Release
        # data-YYYY-MM-DD holds demographics.json.gz, the week's full study
        # records (what src/full_records.py reads), plus the raw sex/gender
        # measures and the extraction log. These releases are the permanent
        # record and are never pruned: Drive is not configured, and once the
        # site's contract turns the split layout on, the site's files carry
        # only the fields the dashboard reads, so they cannot rebuild the full
        # records. It runs before the site checkout (and so before the split),
        # so a site-side failure (an expired deploy token, a rejected push, a
        # site contract the split refuses) cannot skip it, and with
        # continue-on-error, so its failure cannot hold up the site's data.
        # Each gh call gets three tries; if all fail, the next step keeps the
        # files as a workflow artifact and the last step of the job turns the
        # run red. Runs whenever the full file was produced, even if a
        # generator above failed: the week's records are kept regardless.
        if: ${{ !cancelled() && steps.compress_full.outcome == 'success' }}
        id: data_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="data-$CURRENT_DATE"
          ASSETS="data/demographics.json.gz data/sex_gender_raw_measures.jsonl.gz extraction_log.txt.gz"
          gzip -c extraction_log.txt > extraction_log.txt.gz || true
          # sex_gender_raw_measures.jsonl.gz: the SELECTED sex/gender baseline
          # measures per trial, verbatim. Nothing else retains them, and they are
          # what makes this snapshot re-parseable after a parser rule change.
          ok=0
          for attempt in 1 2 3; do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              # Same-day re-run: replace the assets on the existing release
              gh release upload "$TAG" $ASSETS --clobber --repo "$GITHUB_REPOSITORY" && { ok=1; break; }
            else
              gh release create "$TAG" $ASSETS \
                --repo "$GITHUB_REPOSITORY" \
                --title "Weekly data $CURRENT_DATE" \
                --notes "Raw ClinicalTrials.gov extraction from the $CURRENT_DATE weekly run (code commit $GITHUB_SHA): demographics.json.gz holds the week's full study records. Kept permanently; weekly data releases are not pruned. sex_gender_raw_measures.jsonl.gz holds the selected sex/gender baseline measures per trial for re-parsing." \
                && { ok=1; break; }
            fi
            echo "::warning::release $TAG, attempt $attempt failed"
            [ "$attempt" = 3 ] || sleep 20
          done
          if [ "$ok" != "1" ]; then
            echo "::error::the full-record release $TAG failed three times. The files are kept as this run's artifact full-records-$CURRENT_DATE for 90 days: download it and run gh release create $TAG <its three files> --repo $GITHUB_REPOSITORY (or gh release upload $TAG <files> --clobber if the release exists)."
            exit 1
          fi
          echo "Kept the week's full records on release $TAG"

      - name: Keep the full records as a workflow artifact if the release failed
        # The runner is discarded when the job ends, and with it the only copy
        # of a week whose release failed. The artifact is what the recovery
        # instructions above download.
        if: ${{ !cancelled() && steps.data_release.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: full-records-${{ env.CURRENT_DATE }}
          path: |
            data/demographics.json.gz
            data/sex_gender_raw_measures.jsonl.gz
            extraction_log.txt.gz
          retention-days: 90
          if-no-files-found: error

      - name: Archive the retained sex/gender raw measures permanently
        # The selected raw measures are what makes a snapshot re-parseable
        # after a parser rule change. Besides the week's data-* release they
        # also go to ONE permanent release (tag sex-gender-raw-measures), one
        # asset per snapshot date, so they can be fetched together. It runs
        # before the site checkout and needs only the engine's own file, so
        # a site-side failure (the publish step's contract check refusing a
        # week, a rejected push) cannot skip it, nor can a failed sex/gender
        # table build, when the raw measures are what a re-parse needs. It
        # runs only when the extraction itself succeeded: a failed or killed
        # extraction can leave a partial file, and the upload below replaces
        # a same-day asset. scripts/check_raw_measures.py checks the file is
        # whole and this run's before the upload. continue-on-error keeps it
        # from holding up the site's data. The last step of the job fails the
        # run if this outcome is 'failure', so an unarchived week is noticed.
        if: ${{ !cancelled() && steps.extract.outcome == 'success' }}
        id: sg_archive
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="sex-gender-raw-measures"
          ASSET="$RUNNER_TEMP/${CURRENT_DATE}_sex_gender_raw_measures.jsonl.gz"
          if ! python3 scripts/check_raw_measures.py data/sex_gender_raw_measures.jsonl.gz --snapshot-date "$CURRENT_DATE"; then
            echo "::error::the raw sex/gender measures for $CURRENT_DATE are not whole; nothing was uploaded, and any earlier $CURRENT_DATE asset on release $TAG is kept"
            exit 1
          fi
          cp data/sex_gender_raw_measures.jsonl.gz "$ASSET"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Sex/gender raw measures (permanent archive)" \
              --notes "One asset per weekly snapshot: the SELECTED sex/gender baseline measures per trial, verbatim, with snapshot_date, extracted_at and pipeline_commit on every record. Re-parse with scripts/build_sex_gender_table.py --from-raw. Not pruned."
          fi
          if ! gh release upload "$TAG" "$ASSET" --clobber --repo "$GITHUB_REPOSITORY"; then
            echo "::error::permanent archive of the sex/gender raw measures for $CURRENT_DATE failed; re-run this step or upload $ASSET to release $TAG by hand"
            exit 1
          fi
          echo "Archived $(basename "$ASSET") to release $TAG"

      - name: Set up Node (the publish step runs the site's own Overview code)
        # scripts/first_view_parity.mjs runs the site's app.js over this week's
        # parts before the push; pinned as in ci.yml, so the check does not
        # depend on the runner's default node. Here, with the site-side steps:
        # like them, it is skipped once an earlier step fails.
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check out the site repository
        uses: actions/checkout@v4
        with:
          repository: michaeldgreenphd/clinical-trial-populations
          ref: main
          token: ${{ secrets.PIPELINE_DEPLOY_TOKEN }}
          path: site

      - name: Cut the week's records into the site's dataset files
        # Here, after the site checkout, because the site's own contract
        # decides it: site/tests/record_contract.json lists the fields the
        # site reads, in classes, and its layout section carries the owner's
        # switch. Off (or no layout section): the whole records in 8 parts,
        # as before. On: core parts, Studies-tab parts and detail shards
        # (scripts/split_data.py). A contract this engine cannot follow (a
        # layout version it does not know) stops the run here, and the site
        # keeps last week's data. This step only reads data/demographics.json;
        # the week's data-* release above already holds it. --snapshot-date
        # writes this run's date into run.json: history.json names it as the
        # latest, and the site serves that date from data/ only when
        # data/run.json gives it (a pull that runs past midnight UTC stamps
        # extracted_at with the next day).
        run: python3 scripts/split_data.py --contract site/tests/record_contract.json --demographics data/demographics.json --out-dir data/dataset --snapshot-date "$CURRENT_DATE"

      - name: Publish artifacts, archive snapshot, and push to the site
        run: |
          # One date for the whole run: history.json's latest (the date data/
          # serves), the release tag and the raw-measure asset all key on
          # CURRENT_DATE (set at job start).
          DATE="$CURRENT_DATE"

          # Nothing is archived, pruned or staged without this week's dataset.
          test -n "$(find data/dataset -type f -print -quit)"

          # Keep last week's summary for the run-summary delta below
          cp site/data/dashboard-summary.json "$RUNNER_TEMP/prev_summary.json" 2>/dev/null || true

          # A same-day re-run replaces the data/ that history.json already
          # serves as $DATE: deliberately, but loudly.
          REPLACED=""
          if [ "$(jq -r '.latest // (.dates | max) // empty' site/history.json 2>/dev/null)" = "$DATE" ]; then
            echo "::warning::history.json already serves $DATE from data/ — this re-run replaces the earlier same-day data."
            REPLACED=" (replaces earlier $DATE data)"
          fi

          # Snapshot retention (scripts/prune_snapshots.py), BEFORE this
          # week's files replace data/: last week's dataset is still there,
          # and is copied into snapshots/<its date>/ when the policy keeps it
          # (every file's stamps checked first, every copy compared after).
          # The policy keeps three complete snapshots, one per fortnight
          # counted from a fixed Sunday, so the set moves by at most one a
          # week and no week is deleted before it can be kept; and one
          # aggregate per older month: its summary and its own
          # archive_records.json.gz, written from its own records before its
          # other files go. It rewrites history.json: dates, latest (this
          # run's date: data/ serves it, and it is not copied into snapshots/
          # as well), archives. It stops the step, changing nothing, when
          # history.json cannot be read or a snapshot is newer than $DATE.
          python3 scripts/prune_snapshots.py --site site --latest "$DATE" --report "$RUNNER_TEMP/retention.json"

          # This week's dataset, as scripts/split_data.py wrote it to
          # data/dataset/: the demographics parts and run.json (the run's
          # stamps; the site keys its data cache by extracted_at), plus the
          # studies_tab parts and detail/ shards when the site's contract turns
          # the split on. Last week's dataset files go first, so a switch of
          # layout either way, the rollback included, leaves none of the other
          # layout's files behind. Only these names are removed: the frozen
          # data/details.part*.json.gz and the rest of data/ stay.
          rm -f site/data/demographics.part*.json.gz site/data/studies_tab.part*.json.gz site/data/run.json
          rm -rf site/data/detail
          cp -R data/dataset/. site/data/
          cp data/dashboard-summary.json data/industry_sponsors.json site/data/
          # Sex/gender table + meta ride with the parts; the methods text is its own folder
          cp data/sex_gender_parsed.csv.gz data/sex_gender_parsed_meta.json site/data/
          mkdir -p site/data/sex_gender
          cp data/sex_gender/methods.json data/sex_gender/methods.md site/data/sex_gender/
          # condition_ontology.json is canonical here; the site fetches it at runtime
          cp condition_ontology.json site/condition_ontology.json

          cd site

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The dataset, staged exactly: every file this week's holds, and the
          # removal of every file last week's held that this week's does not.
          # Nothing else under data/ is swept in.
          DATASET=$( { (cd ../data/dataset && find . -type f | sed 's|^\./|data/|')
                       git ls-files -- 'data/demographics.part*.json.gz' 'data/studies_tab.part*.json.gz' data/detail data/run.json; } | sort -u )
          test -n "$DATASET"
          git add -A -- $DATASET
          git add data/dashboard-summary.json data/industry_sponsors.json
          git add data/sex_gender_parsed.csv.gz data/sex_gender_parsed_meta.json data/sex_gender/
          git add condition_ontology.json
          git add -A snapshots/ history.json
          # Check what is staged against the site's own record contract and
          # data budget (scripts/check_site_contract.py) before anything is
          # committed: a file missing a field the site reads, malformed, from
          # another run, a split layout the site's contract does not turn on,
          # a history.json whose latest is not $DATE, a data/run.json that
          # does not date its run $DATE, or a history.json that lists a snapshot
          # that would not open (a folder gone, a complete snapshot missing a
          # file or carrying another run's stamps, an aggregate's archive file
          # missing, another run's or not covering its recent studies), a
          # file over GitHub's 100 MiB per-file push limit, or a site over
          # GitHub Pages' 1 GB limit stops the publish here, and the site
          # keeps last week's data. Over the size budgets only warns. The same
          # check recounts dashboard-summary.json's firstView (the Overview as
          # it opens, src/first_view.py) from the staged parts and stops the
          # publish when the block is missing or differs in any number.
          python3 ../scripts/check_site_contract.py --site . --latest "$DATE" --report "$RUNNER_TEMP/site_check.json"
          # The block against the site's own Overview code: this checkout's
          # app.js and index.html, the page this push updates, run over the
          # staged parts (scripts/first_view_parity.mjs). A site change to the
          # Overview's rules that the engine has not followed stops the
          # publish here, rather than publishing numbers the page would not
          # draw; the site keeps last week's data. Exit 1 is a mismatch;
          # exit 2, an input or site code the script cannot read (its message
          # is printed above). GitHub shows at most 10 error annotations a
          # step, so the line that says nothing was pushed comes first, then
          # eight mismatches and a count of the rest, which follow as plain
          # log lines (the whole report is $RUNNER_TEMP/first_view_parity.json).
          FV_RECORDS=""
          for part in data/demographics.part*.json.gz; do FV_RECORDS="$FV_RECORDS --records $part"; done
          if ! node ../scripts/first_view_parity.mjs $FV_RECORDS --summary data/dashboard-summary.json --app app.js --index index.html > "$RUNNER_TEMP/first_view_parity.json"; then
            echo "::error::dashboard-summary.json's firstView is not what the site's own Overview code (app.js, index.html) counts and paints from this week's parts, or the check could not run; nothing was pushed, and the site keeps last week's data."
            jq -r '(.mismatches // []) as $m
              | ($m[:8][] | "::error::first-view parity, \(.check): \(.detail | tojson | .[0:500])"),
                (if ($m | length) > 8 then "::error::first-view parity: \(($m | length) - 8) more mismatches, in the step log below",
                   ($m[8:][] | "first-view parity, \(.check): \(.detail | tojson | .[0:500])") else empty end)' "$RUNNER_TEMP/first_view_parity.json" 2>/dev/null || true
            exit 1
          fi
          echo "first-view parity: ok, $(jq -r '"\(.checked) checks on \(.records.count) records"' "$RUNNER_TEMP/first_view_parity.json")"
          git commit -m "Update demographics data $DATE$REPLACED" || exit 0
          git push

      # ── Sex/gender curation inbox (scripts/sex_gender_audit.py) ──────────
      # Runs after the site publish (an audit problem can never delay the
      # site's data) and BEFORE the sponsor steps, which are an independent
      # pipeline whose deliberate failures (a rules conflict) must not skip
      # this. Priors are last week's committed data/sex_gender_audit/; every
      # prior is read before anything is written.
      - name: Sex/gender curation audit
        id: sg_audit
        run: |
          python3 scripts/sex_gender_audit.py \
            --table data/sex_gender_parsed.csv.gz \
            --meta data/sex_gender_parsed_meta.json \
            --raw-measures data/sex_gender_raw_measures.jsonl.gz \
            --prior-dir data/sex_gender_audit \
            --snapshot-date "$CURRENT_DATE" \
            --out-dir data/sex_gender_audit

      - name: Publish sex/gender audit to the site
        run: |
          mkdir -p site/data/sex_gender/audit
          cp data/sex_gender_audit/label_buckets.csv data/sex_gender_audit/inbox_unrecognized.csv \
             data/sex_gender_audit/inbox_exits.csv data/sex_gender_audit/bucket_changes.csv \
             data/sex_gender_audit/resolved_labels.csv \
             data/sex_gender_audit/status_counts.json data/sex_gender_audit/audit_summary.json \
             site/data/sex_gender/audit/
          cd site
          git add data/sex_gender/audit
          git commit -m "Update sex/gender audit $CURRENT_DATE" || exit 0
          git push

      # ── Company-level sponsor filter (sponsors/README.md) ─────────────
      # These run AFTER the demographics publish on purpose: a rules conflict
      # raises inside build_index() (invariant 6) and turns the run red, but
      # the site already has this week's data.
      - name: Build sponsor bridge
        id: bridge
        run: python3 scripts/build_sponsor_bridge.py --demographics data/demographics.json

      - name: Sponsor curation audit
        id: audit
        # Prior bridge = the site's copy as checked out BEFORE this week's
        # overwrite; prior unmatched list = last week's committed audit here.
        run: |
          python3 scripts/sponsor_audit.py \
            --demographics data/demographics.json \
            --snapshot-date "$CURRENT_DATE" \
            --prior-bridge site/data/sponsors/bridge.csv.gz \
            --prior-meta site/data/sponsors/bridge_meta.json \
            --prior-literals data/sponsor_audit/literals_all.csv.gz \
            --prior-open data/sponsor_audit/inbox_open.csv.gz \
            --prior-trials data/sponsor_audit/trial_sponsors.csv.gz

      - name: Publish sponsor bridge to the site
        # The bridge goes to data/sponsors/ only. No page reads a snapshot's
        # bridge (the company filter reads data/'s), and the week's date has
        # no snapshot folder (data/ serves it); every week's bridge stays in
        # the site's git history, and the week's full records on its data-*
        # release can rebuild it under that week's rules.
        run: |
          mkdir -p site/data/sponsors/audit
          cp data/sponsors/bridge.csv.gz data/sponsors/bridge_meta.json site/data/sponsors/
          # The audit files the (password-curtained) audit tab reads live on
          # the site too, so the tab keeps working if this repo goes private.
          cp data/sponsor_audit/inbox_new_unmatched.csv data/sponsor_audit/inbox_open.csv.gz \
             data/sponsor_audit/match_changes.csv data/sponsor_audit/label_changes.csv \
             data/sponsor_audit/literals_all.csv.gz data/sponsor_audit/audit_summary.json \
             site/data/sponsors/audit/
          cd site
          git add data/sponsors
          git commit -m "Update sponsor bridge $CURRENT_DATE" || exit 0
          git push

      - name: Commit sponsor and sex/gender audits to this repo
        # Runs when either audit produced files this week, even if the other
        # pipeline failed (the two are independent).
        if: ${{ !cancelled() && (steps.audit.outcome == 'success' || steps.sg_audit.outcome == 'success') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage only the audit whose step succeeded: a failed audit may have
          # written some of its files, and those must not replace the
          # committed priors (the next run reads them).
          if [ "${{ steps.audit.outcome }}" = "success" ]; then
            git add data/sponsor_audit/
          else
            git checkout -- data/sponsor_audit/ 2>/dev/null || true
          fi
          if [ "${{ steps.sg_audit.outcome }}" = "success" ]; then
            git add data/sex_gender_audit/
          else
            git checkout -- data/sex_gender_audit/ 2>/dev/null || true
          fi
          git commit -m "Sponsor and sex/gender audits $CURRENT_DATE" || exit 0
          # main may have moved during the ~1h run; replay our one commit on top
          git pull --rebase origin main
          git push

      - name: Write run summary
        if: always()
        run: |
          NEW=$(jq -r '.totalStudies // "n/a"' data/dashboard-summary.json 2>/dev/null || echo "n/a")
          PREV=$(jq -r '.totalStudies // "n/a"' "$RUNNER_TEMP/prev_summary.json" 2>/dev/null || echo "n/a")
          DELTA="n/a"
          case "${NEW}${PREV}" in
            *n/a*) ;;
            *) DELTA=$((NEW - PREV)) ;;
          esac
          {
            echo "## Weekly extraction — $CURRENT_DATE"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Trials in dataset | $NEW |"
            echo "| Previous week | $PREV |"
            echo "| Change vs previous | $DELTA |"
            # The site's dataset files, gzipped, per class (scripts/split_data.py's run.json)
            if [ -f data/dataset/run.json ]; then
              echo "| Site dataset files | $(jq -r '(if .layout then "split (layout \(.layout.version), \(.layout.detail.shards) detail shards)" else "whole records (no layout)" end) + ": " + ([(.gzip_bytes // {}) | to_entries[] | "\(.key) \((.value / 1e5 + 0.5 | floor) / 10) MB"] | join(", "))' data/dataset/run.json) |"
            else
              echo "| Site dataset files | not written this week |"
            fi
            echo "| Code commit | \`${GITHUB_SHA}\` |"
            # The audit files are committed in this repo, so last week's are
            # always on disk: report them only when THIS run's steps produced
            # them, never as a stale stand-in.
            if [ "${{ steps.bridge.outcome }}" = "success" ]; then
              echo "| Sponsor bridge | $(jq -r '"\(.n_rows) rows, \(.n_companies) companies, \(.n_trials) trials"' data/sponsors/bridge_meta.json) |"
            else
              echo "| Sponsor bridge | step ${{ steps.bridge.outcome }} — no bridge published this week; the site keeps last week's |"
            fi
            if [ "${{ steps.audit.outcome }}" = "success" ]; then
              echo "| Sponsor curation inbox | $(jq -r '"\(.inbox_size) new unmatched literal(s); top: \(.inbox_top.name // "—")"' data/sponsor_audit/audit_summary.json) |"
              echo "| Sponsor match changes | $(jq -r '"\(.n_match_changes) literal / \(.n_label_changes) trial-label (causes: \(.label_change_causes | tojson))"' data/sponsor_audit/audit_summary.json) |"
              echo "| Sponsor inbox open | $(jq -r '"\(.inbox_open_count) open (\(.inbox_open_industry_count) INDUSTRY); oldest INDUSTRY: \(.inbox_open_oldest_industry.name // "—") (\(.inbox_open_oldest_industry.weeks_open // 0) wk, \(.inbox_open_oldest_industry.n_trials // 0) trials)"' data/sponsor_audit/audit_summary.json) |"
            else
              echo "| Sponsor audit | step ${{ steps.audit.outcome }} — no audit this week (files in data/sponsor_audit/ are last week's) |"
            fi
            # Sex/gender table (sg=v2): status counts, the curation inbox, and
            # the parser rules version every row carries.
            if [ -f data/sex_gender_parsed_meta.json ]; then
              echo "| Sex/gender table | $(jq -r '"\(.n_rows) rows; status \(.status_counts.status | tojson); structural checks \(if .structural_checks_all_pass then "pass" else "FAIL" end); baseline drift lines \(.baseline.drift | length)"' data/sex_gender_parsed_meta.json) |"
              echo "| Sex/gender parser rules | \`$(jq -r '.parser_rules_version' data/sex_gender_parsed_meta.json)\` (module $(jq -r '.parser_module_version' data/sex_gender_parsed_meta.json)) |"
            else
              echo "| Sex/gender table | not built this week |"
            fi
            if [ "${{ steps.sg_audit.outcome }}" = "success" ]; then
              echo "| Sex/gender curation inbox | $(jq -r '"\(.inbox_size) unrecognized label(s) (\(.inbox_new_this_week) new); top: \(.inbox_top.label // "—") (\(.inbox_top.n_trials // 0) trials); exits \(.n_inbox_exits)"' data/sex_gender_audit/audit_summary.json) |"
              echo "| Sex/gender bucket changes | $(jq -r '"\(.n_bucket_changes) (causes: \(.bucket_change_causes | tojson)); rules changed vs prior: \(.rules_changed_vs_prior)"' data/sex_gender_audit/audit_summary.json) |"
            else
              echo "| Sex/gender audit | step ${{ steps.sg_audit.outcome }} — no audit this week (files in data/sex_gender_audit/ are last week's) |"
            fi
            echo "| Full-record release | step ${{ steps.data_release.outcome }} (release data-$CURRENT_DATE) |"
            if [ -f "$RUNNER_TEMP/site_check.json" ]; then
              echo "| Site contract check | $(jq -r '"\(if .ok then "passed" else "FAILED, nothing published" end): \(.records // 0) records; parts \((.parts_gzip_bytes // 0) / 1e6 | floor) MB of a \((.total_budget_bytes // 0) / 1e6 | floor) MB budget; site \((.tree_bytes // 0) / 1e6 | floor) MB; \(.errors | length) errors, \(.warnings | length) warnings"' "$RUNNER_TEMP/site_check.json") |"
            fi
            # The first-view parity has its own row: when it stops the push,
            # the contract check above still reads passed.
            if [ -f "$RUNNER_TEMP/first_view_parity.json" ]; then
              FV_ROW=$(jq -r 'if .ok then "passed: \(.checked) checks on \(.records.count) records" else "FAILED, nothing published: \(.mismatches | length) of \(.checked) checks differ" end' "$RUNNER_TEMP/first_view_parity.json" 2>/dev/null || true)
              echo "| First-view parity | ${FV_ROW:-could not run, nothing published (the publish step log says why)} |"
            elif [ -f "$RUNNER_TEMP/site_check.json" ]; then
              echo "| First-view parity | not run: the publish step stopped before it |"
            fi
            # What retention did this week (scripts/prune_snapshots.py): until
            # 2026-10 removals went only to the log, and a pruning bug deleted
            # every week's snapshot for three months unnoticed.
            if [ -f "$RUNNER_TEMP/retention.json" ]; then
              echo "| Snapshot retention | $(jq -r '"latest \(.latest) (data/); last week \(.archived.date // "none"): \(.archived.status // "nothing to archive"); complete: \(.complete | join(", ")); \(.aggregates | length) monthly aggregates (\(.archive_files | length) with their own records); slimmed: \(if (.slimmed | length) > 0 then (.slimmed | join(", ")) else "none" end); removed: \(if (.removed | length) > 0 then (.removed | join(", ")) else "none" end)\(if (.warnings | length) > 0 then "; \(.warnings | length) warnings" else "" end)"' "$RUNNER_TEMP/retention.json") |"
            fi
            echo "| Sex/gender raw-measure archive | step ${{ steps.sg_archive.outcome }} (release sex-gender-raw-measures) |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.sg_audit.outcome }}" = "success" ]; then
            BC=$(jq -r '.n_bucket_changes' data/sex_gender_audit/audit_summary.json)
            if [ "$BC" -gt 0 ]; then
              echo "::warning::$BC sex/gender label(s) changed bucket vs last week — review data/sex_gender_audit/bucket_changes.csv"
            fi
            if [ "$(jq -r '.structural_checks_all_pass' data/sex_gender_audit/audit_summary.json)" != "true" ]; then
              echo "::warning::a sex/gender structural check failed — see data/sex_gender_audit/status_counts.json"
            fi
          fi
          if [ "${{ steps.audit.outcome }}" = "success" ]; then
            CH=$(jq -r '.n_match_changes' data/sponsor_audit/audit_summary.json)
            if [ "$CH" -gt 0 ]; then
              echo "::warning::$CH sponsor literal(s) changed attribution vs last week — review data/sponsor_audit/match_changes.csv"
            fi
          fi
          # A shrinking dataset is possible but rare (CT.gov removals) —
          # flag it so a bad pull announces itself.
          if [ "$DELTA" != "n/a" ] && [ "$DELTA" -lt 0 ]; then
            echo "::warning::Trial count decreased by ${DELTA#-} vs last week — check the extraction before trusting this publish."
          fi

      - name: Fail the run if the week's full-record release failed
        # Last, with the raw-measure gate below, so every independent step
        # has already run. A red run here means this week's full records are
        # on no release, only on the 90-day workflow artifact
        # full-records-<date>: download it and create the data-<date> release
        # by hand. Re-running the job is not a substitute: it pulls the
        # registry again, possibly on another date.
        if: ${{ !cancelled() && steps.data_release.outcome == 'failure' }}
        run: |
          echo "::error::this week's full study records are on no release. Download this run's artifact full-records-$CURRENT_DATE and create release data-$CURRENT_DATE from it by hand (see the 'Keep the week's full records on a permanent GitHub Release' step)."
          exit 1

      - name: Fail the run if the permanent raw-measure archive failed
        # Last, so every independent step above (audits, sponsor pipeline,
        # summary) has already run. A red run here means one week's raw
        # measures are not in the permanent release. If the archive step's
        # check refused the file (its ::error:: lines say why), re-run the
        # workflow; if the upload itself failed, upload the file by hand from
        # the data-* release or Drive.
        if: ${{ !cancelled() && steps.sg_archive.outcome == 'failure' }}
        run: |
          echo "::error::the permanent archive of this week's sex/gender raw measures failed (see the 'Archive the retained sex/gender raw measures permanently' step)"
          exit 1
