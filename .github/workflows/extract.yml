name: Extract Demographics Data

# Weekly demographics extraction. Runs the pipeline in this repo, then
# publishes the dashboard artifacts into michaeldgreenphd/clinical-trial-populations
# (the GitHub Pages site) via the PIPELINE_DEPLOY_TOKEN fine-grained PAT.

on:
  schedule:
    - cron: '0 6 * * 0'  # Weekly on Sunday at 6 AM UTC
  workflow_dispatch:  # Manual trigger

jobs:
  extract:
    runs-on: ubuntu-latest
    env:
      GDRIVE_ENABLED: ${{ secrets.GDRIVE_CLIENT_ID != '' }}
    permissions:
      contents: write  # for the weekly GitHub Release backup in THIS repo

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set current date
        run: echo "CURRENT_DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run extraction
        # pipefail so a tee'd log can never mask an extraction failure
        run: |
          set -o pipefail
          python -m src.extract_all --output data/demographics.json --results-after 2009-01-01 2>&1 | tee extraction_log.txt

      - name: Compress CT.gov Data for Drive
        # -k keeps the original so the split step can still read it.
        run: gzip -k data/demographics.json

      - name: Upload CT.gov Data to Google Drive via OAuth
        # Backups are best-effort: skipped when Drive secrets aren't
        # configured, and a failure warns loudly but never blocks the
        # weekly publish (Drive failures went unnoticed for months when
        # they could take the whole run down with them).
        if: env.GDRIVE_ENABLED == 'true'
        env:
          CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          CHILD_FOLDER: CT_gov_API_Data
          FILE_PATH: ${{ github.workspace }}/data/demographics.json.gz
          FILE_NAME: ${{ env.CURRENT_DATE }}_CTgov_demographics.json.gz
        run: python scripts/gdrive_upload.py || echo "::warning::Google Drive upload failed — see this step's log. Publishing is unaffected."

      - name: Split and generate dashboard artifacts
        run: |
          # Split into 8 parts (desktop) + generate mobile dashboard summary
          python3 scripts/split_data.py
          python3 scripts/generate_mobile_data.py
          # Gated industry sponsor view dataset (/#industry)
          python3 scripts/generate_industry_sponsors.py

          for f in data/demographics.part*.json.gz; do
            echo "$(basename $f): $(du -h "$f" | cut -f1)"
          done
          echo "dashboard-summary.json: $(du -h data/dashboard-summary.json | cut -f1)"

      - name: Check out the site repository
        uses: actions/checkout@v4
        with:
          repository: michaeldgreenphd/clinical-trial-populations
          ref: main
          token: ${{ secrets.PIPELINE_DEPLOY_TOKEN }}
          path: site

      - name: Publish artifacts, archive snapshot, and push to the site
        run: |
          # One date for the whole run: the snapshot folder, the release tag
          # and the bridge snapshot all key on CURRENT_DATE (set at job start).
          DATE="$CURRENT_DATE"

          # Keep last week's summary for the run-summary delta below
          cp site/data/dashboard-summary.json "$RUNNER_TEMP/prev_summary.json" 2>/dev/null || true

          # Copy this week's artifacts into the site checkout
          cp data/demographics.part*.json.gz data/dashboard-summary.json data/industry_sponsors.json site/data/
          # condition_ontology.json is canonical here; the site fetches it at runtime
          cp condition_ontology.json site/condition_ontology.json

          cd site

          # Archive snapshot for historical access via GitHub Pages.
          # Snapshot folders are keyed by date, so a same-day re-run
          # replaces that day's snapshot — deliberately, but loudly.
          REPLACED=""
          if [ -d "snapshots/$DATE" ]; then
            echo "::warning::snapshots/$DATE already exists — this re-run replaces the earlier same-day snapshot."
            REPLACED=" (replaces earlier $DATE snapshot)"
          fi
          mkdir -p "snapshots/$DATE"
          cp data/demographics.part*.json.gz data/dashboard-summary.json data/industry_sponsors.json "snapshots/$DATE/"
          echo "Archived snapshot to snapshots/$DATE/"

          # Update history manifest
          if [ ! -f history.json ]; then
            echo '{"dates":[]}' > history.json
          fi
          jq --arg d "$DATE" '.dates += [$d] | .dates |= unique' history.json > history.json.tmp
          mv history.json.tmp history.json

          # Prune snapshots to the retention policy (4 bi-weekly, then one
          # per month) so the published Pages site stays well under the
          # size range where deploy syncs start timing out. Rewrites
          # history.json to exactly the retained dates.
          python3 ../scripts/prune_snapshots.py

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/demographics.part*.json.gz data/dashboard-summary.json data/industry_sponsors.json
          git add condition_ontology.json
          git add -A snapshots/ history.json
          git commit -m "Update demographics data $DATE$REPLACED" || exit 0
          git push

      - name: Back up raw dump to a GitHub Release
        # Best-effort, like all backups: a failure warns but never fails
        # the run (this step runs AFTER the site publish, so it cannot
        # block it either). Keeps the 26 most recent weekly dumps; the
        # split parts in the site repo's git history are the permanent
        # record, and merge_parts.py reconstructs the dump from them.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="data-$CURRENT_DATE"
          gzip -c extraction_log.txt > extraction_log.txt.gz || true
          ok=1
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Same-day re-run: replace the assets on the existing release
            gh release upload "$TAG" data/demographics.json.gz extraction_log.txt.gz \
              --clobber --repo "$GITHUB_REPOSITORY" || ok=0
          else
            gh release create "$TAG" data/demographics.json.gz extraction_log.txt.gz \
              --repo "$GITHUB_REPOSITORY" \
              --title "Weekly data $CURRENT_DATE" \
              --notes "Raw ClinicalTrials.gov extraction from the $CURRENT_DATE weekly run (code commit $GITHUB_SHA). The split parts published to the site repo contain the same data." \
              || ok=0
          fi
          if [ "$ok" = "0" ]; then
            echo "::warning::GitHub Release backup failed — see this step's log. Publishing was unaffected."
            exit 0
          fi
          # Prune weekly data releases beyond the newest 26
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName -q '.[].tagName' \
            | grep '^data-' | sort -r | tail -n +27 \
            | while read -r t; do
                gh release delete "$t" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" \
                  || echo "::warning::Failed to prune old data release $t"
              done
          echo "Backed up to release $TAG"

      # ── Company-level sponsor filter (sponsors/README.md) ─────────────
      # These run AFTER the demographics publish on purpose: a rules conflict
      # raises inside build_index() (invariant 6) and turns the run red, but
      # the site already has this week's data.
      - name: Build sponsor bridge
        id: bridge
        run: python3 scripts/build_sponsor_bridge.py --demographics data/demographics.json

      - name: Sponsor curation audit
        id: audit
        # Prior bridge = the site's copy as checked out BEFORE this week's
        # overwrite; prior unmatched list = last week's committed audit here.
        run: |
          python3 scripts/sponsor_audit.py \
            --demographics data/demographics.json \
            --snapshot-date "$CURRENT_DATE" \
            --prior-bridge site/data/sponsors/bridge.csv.gz \
            --prior-meta site/data/sponsors/bridge_meta.json \
            --prior-literals data/sponsor_audit/literals_all.csv.gz \
            --prior-open data/sponsor_audit/inbox_open.csv.gz \
            --prior-trials data/sponsor_audit/trial_sponsors.csv.gz

      - name: Publish sponsor bridge to the site
        run: |
          mkdir -p site/data/sponsors/audit "site/snapshots/$CURRENT_DATE/sponsors"
          cp data/sponsors/bridge.csv.gz data/sponsors/bridge_meta.json site/data/sponsors/
          cp data/sponsors/bridge.csv.gz data/sponsors/bridge_meta.json "site/snapshots/$CURRENT_DATE/sponsors/"
          # The audit files the (password-curtained) audit tab reads live on
          # the site too, so the tab keeps working if this repo goes private.
          cp data/sponsor_audit/inbox_new_unmatched.csv data/sponsor_audit/inbox_open.csv.gz \
             data/sponsor_audit/match_changes.csv data/sponsor_audit/label_changes.csv \
             data/sponsor_audit/literals_all.csv.gz data/sponsor_audit/audit_summary.json \
             site/data/sponsors/audit/
          cd site
          git add data/sponsors "snapshots/$CURRENT_DATE/sponsors"
          git commit -m "Update sponsor bridge $CURRENT_DATE" || exit 0
          git push

      - name: Commit sponsor audit to this repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sponsor_audit/
          git commit -m "Sponsor audit $CURRENT_DATE" || exit 0
          # main may have moved during the ~1h run; replay our one commit on top
          git pull --rebase origin main
          git push

      - name: Write run summary
        if: always()
        run: |
          NEW=$(jq -r '.totalStudies // "n/a"' data/dashboard-summary.json 2>/dev/null || echo "n/a")
          PREV=$(jq -r '.totalStudies // "n/a"' "$RUNNER_TEMP/prev_summary.json" 2>/dev/null || echo "n/a")
          DELTA="n/a"
          case "${NEW}${PREV}" in
            *n/a*) ;;
            *) DELTA=$((NEW - PREV)) ;;
          esac
          PARTS_MB=$(du -mc data/demographics.part*.json.gz 2>/dev/null | tail -1 | cut -f1 || echo "n/a")
          {
            echo "## Weekly extraction — $CURRENT_DATE"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Trials in dataset | $NEW |"
            echo "| Previous week | $PREV |"
            echo "| Change vs previous | $DELTA |"
            echo "| Split parts total | ${PARTS_MB} MB |"
            echo "| Code commit | \`${GITHUB_SHA}\` |"
            # The audit files are committed in this repo, so last week's are
            # always on disk: report them only when THIS run's steps produced
            # them, never as a stale stand-in.
            if [ "${{ steps.bridge.outcome }}" = "success" ]; then
              echo "| Sponsor bridge | $(jq -r '"\(.n_rows) rows, \(.n_companies) companies, \(.n_trials) trials"' data/sponsors/bridge_meta.json) |"
            else
              echo "| Sponsor bridge | step ${{ steps.bridge.outcome }} — no bridge published this week; the site keeps last week's |"
            fi
            if [ "${{ steps.audit.outcome }}" = "success" ]; then
              echo "| Sponsor curation inbox | $(jq -r '"\(.inbox_size) new unmatched literal(s); top: \(.inbox_top.name // "—")"' data/sponsor_audit/audit_summary.json) |"
              echo "| Sponsor match changes | $(jq -r '"\(.n_match_changes) literal / \(.n_label_changes) trial-label (causes: \(.label_change_causes | tojson))"' data/sponsor_audit/audit_summary.json) |"
              echo "| Sponsor inbox open | $(jq -r '"\(.inbox_open_count) open (\(.inbox_open_industry_count) INDUSTRY); oldest INDUSTRY: \(.inbox_open_oldest_industry.name // "—") (\(.inbox_open_oldest_industry.weeks_open // 0) wk, \(.inbox_open_oldest_industry.n_trials // 0) trials)"' data/sponsor_audit/audit_summary.json) |"
            else
              echo "| Sponsor audit | step ${{ steps.audit.outcome }} — no audit this week (files in data/sponsor_audit/ are last week's) |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.audit.outcome }}" = "success" ]; then
            CH=$(jq -r '.n_match_changes' data/sponsor_audit/audit_summary.json)
            if [ "$CH" -gt 0 ]; then
              echo "::warning::$CH sponsor literal(s) changed attribution vs last week — review data/sponsor_audit/match_changes.csv"
            fi
          fi
          # A shrinking dataset is possible but rare (CT.gov removals) —
          # flag it so a bad pull announces itself.
          if [ "$DELTA" != "n/a" ] && [ "$DELTA" -lt 0 ]; then
            echo "::warning::Trial count decreased by ${DELTA#-} vs last week — check the extraction before trusting this publish."
          fi
